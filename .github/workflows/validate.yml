name: Validate Package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate manifest and Unity metadata
        shell: pwsh
        run: ./.github/scripts/validate-package.ps1 -PackageRoot . -ExpectedName "com.wolfyvr.threadlight.mirroring"
      - name: Validate VPM listing JSON
        shell: bash
        run: |
          jq -e . .vpm-listing/source.json > /dev/null
          jq -e . .vpm-listing/index.json > /dev/null

      - name: Reject premature Add to VCC links
        shell: bash
        run: |
          if [ "$(jq '.packages | length' .vpm-listing/index.json)" -eq 0 ]; then
            ! grep -Fq 'wolfy527.github.io/threadlight-mirroring/?install=1' README.md
          fi
